name: Release

# Every vX.Y (and vX.Y.Z) tag produces the binaries and a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds go through zig: it cross-compiles the C of the bundled
          # SQLite and links statically against musl, for both architectures,
          # without a distro toolchain.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Warn when the tag and Cargo.toml disagree
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          case "$version" in
            "$tag"|"$tag".*) ;;
            *) echo "::warning::tag $GITHUB_REF_NAME does not match Cargo.toml version $version" ;;
          esac

      # A managed Python: the system one on recent Ubuntu refuses pip installs.
      - uses: actions/setup-python@v5
        if: matrix.zig
        with:
          python-version: '3.12'

      - name: Install zig toolchain
        if: matrix.zig
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          name="canari-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/canari" "dist/$name/"
          cp README.md "dist/$name/"
          # systemd unit plus the OpenRC service script and its conf.d file.
          cp -r deploy "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          # Checksums list bare filenames, so `shasum -c SHA256SUMS` works from
          # wherever the archives were downloaded.
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS && rm dist/*.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "canari $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
